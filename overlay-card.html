<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Widget · card</title>
  </head>
  <body>
    <!-- The clickable part. Small window on purpose: everything it covers is
         the only part of the screen this app ever takes a click away from. -->
    <div id="root" class="card-root">
      <div class="card" id="card">
        <div class="eyebrow">
          <span class="dot"></span>
          <span class="eyebrow-text">任务完成</span>
        </div>
        <div class="elapsed" id="elapsed">00:00</div>
        <div class="task" id="task"></div>
        <div class="hint">点击关闭</div>
      </div>
    </div>
    <script type="module" src="/src/overlay-card.ts"></script>
  </body>
</html>
