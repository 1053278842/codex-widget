<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Widget · overlay</title>
  </head>
  <body>
    <!-- full-screen layer for long-running turns; click-through, never focused -->
    <div id="overlay" class="overlay">
      <div class="scrim"></div>
      <div class="wash"></div>
      <div class="edge"></div>
      <div class="card">
        <div class="eyebrow">
          <span class="dot"></span>
          <span class="eyebrow-text">任务完成</span>
        </div>
        <div class="elapsed" id="elapsed">00:00</div>
        <div class="task" id="task"></div>
      </div>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
