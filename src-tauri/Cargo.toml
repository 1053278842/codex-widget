[package]
name = "codex-widget"
version = "0.6.0"
description = "Always-on-top widget that watches Codex task turns"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DSH session logs are stored as concatenated zstd frames
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
# only for SetCurrentProcessExplicitAppUserModelID: without it a toast from a
# not-yet-installed build is attributed to "Windows PowerShell"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
