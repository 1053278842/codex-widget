<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Codex Widget · preview</title>
    <!-- the real stylesheet, so this page cannot drift from the shipped UI -->
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      html,
      body {
        width: auto;
        min-height: 100vh;
        overflow: visible;
        padding: 46px 52px;
        background:
          radial-gradient(1100px 700px at 15% -10%, #2c3140 0%, rgba(44, 49, 64, 0) 60%),
          linear-gradient(180deg, #16181d 0%, #0c0e11 100%);
      }
      h1 {
        font-size: 17px;
        font-weight: 620;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      p.sub {
        margin: 0 0 34px;
        font-size: 12.5px;
        line-height: 1.7;
        color: rgba(237, 237, 239, 0.42);
        max-width: 660px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-bottom: 26px;
      }
      .cap {
        font-size: 11px;
        letter-spacing: 0.1em;
        color: rgba(237, 237, 239, 0.3);
        margin-left: 4px;
      }
      .stale-demo .dot {
        animation: none;
        transform: scale(0.9);
        background: rgba(242, 171, 52, 0.55);
        box-shadow: none;
      }
      .stale-demo .time {
        color: rgba(237, 237, 239, 0.55);
      }
    </style>
  </head>
  <body>
    <h1>Codex Widget</h1>
    <p class="sub">
      两个来源、固定顺序：DSH 在上（底部一条蓝线），Codex 在下。运行中是一颗缓慢呼吸的琥珀色标记 + 等宽计时；
      完成时它转绿、亮一次光环、整颗胶囊转绿底，<b>不出现任何文字</b>。5 分钟后自己淡出。
      空闲状态下整个控件不可见，且鼠标可穿透。
    </p>

    <div class="row">
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
        <div class="pill" data-state="run" data-count="1" data-src="dsh">
          <span class="ring"></span><span class="dot"></span>
          <span class="time">12:34</span><span class="count">×1</span>
          <span class="sea"></span>
        </div>
        <div class="pill" data-state="run" data-count="2" data-src="codex">
          <span class="ring"></span><span class="dot"></span>
          <span class="time">03:12</span><span class="count">×2</span>
        </div>
        <span class="cap">两个来源同时（DSH 上 / Codex 下）</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
        <div class="pill" data-state="done" data-count="1" data-src="dsh">
          <span class="ring"></span><span class="dot"></span>
          <span class="time">12:34</span><span class="count">×1</span>
          <span class="sea"></span>
        </div>
        <div class="pill" data-state="run" data-count="1" data-src="codex">
          <span class="ring"></span><span class="dot"></span>
          <span class="time">03:12</span><span class="count">×1</span>
        </div>
        <span class="cap">DSH 完成、Codex 还在跑</span>
      </div>
    </div>
    <div class="row">
      <div class="pill" data-state="run" data-count="1">
        <span class="ring"></span><span class="dot"></span>
        <span class="time">03:41</span><span class="count">×1</span>
      </div>
      <span class="cap">运行中 · 呼吸</span>
    </div>

    <div class="row">
      <div class="pill" data-state="run" data-count="3">
        <span class="ring"></span><span class="dot"></span>
        <span class="time">12:34</span><span class="count">×3</span>
      </div>
      <span class="cap">三个线程并发</span>
    </div>

    <div class="row">
      <div class="pill" data-state="done" data-count="1">
        <span class="ring"></span><span class="dot"></span>
        <span class="time">03:12</span><span class="count">×1</span>
      </div>
      <span class="cap">刚完成 · 绿点 + 一次光环</span>
    </div>

    <div class="row">
      <div class="pill" data-state="aborted" data-count="1">
        <span class="ring"></span><span class="dot"></span>
        <span class="time">00:41</span><span class="count">×1</span>
      </div>
      <span class="cap">中断</span>
    </div>

    <div class="row">
      <div class="pill stale-demo" data-state="run" data-count="1">
        <span class="ring"></span><span class="dot"></span>
        <span class="time">28:07</span><span class="count">×1</span>
      </div>
      <span class="cap">15 分钟无事件 · 疑似卡住</span>
    </div>
  </body>
</html>
